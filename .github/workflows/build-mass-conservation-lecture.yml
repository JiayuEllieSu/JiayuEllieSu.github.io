name: Build mass conservation lecture PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/latex/mass-conservation/**'
      - '.github/workflows/build-mass-conservation-lecture.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Compile lecture notes
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: assets/latex/mass-conservation
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Publish compiled PDF
        run: |
          mkdir -p assets/papers
          cp assets/latex/mass-conservation/main.pdf assets/papers/mass-conservation-differential-formulation.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/papers/mass-conservation-differential-formulation.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish mass conservation lecture PDF"
            git push
          fi
