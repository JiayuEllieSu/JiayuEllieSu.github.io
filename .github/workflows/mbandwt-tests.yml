name: mbandwt tests

on:
  push:
    paths:
      - "software/mbandwt/**"
      - ".github/workflows/mbandwt-tests.yml"
  pull_request:
    paths:
      - "software/mbandwt/**"
      - ".github/workflows/mbandwt-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: software/mbandwt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
